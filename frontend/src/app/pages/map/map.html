<div class="map-container">
  <button class="filter-toggle" id="filterToggle">
  <i class="fas fa-filter"></i>
  </button>
  <!-- Header Section -->
  <section class="map-header">
    <h1 class="map-title">Mapa do Ecossistema de Inovação</h1>
    <p class="map-description">Explore os atores e recursos de inovação em Joinville</p>
  </section>

  <!-- Main Map Content -->
  <div class="map-content">
    <!-- Filters Sidebar -->
    <aside class="map-filters">
      <div class="filters-header">
        <h3>Filtros</h3>
        <button class="clear-filters">Limpar</button>
      </div>
      
      <div class="filter-group">
        <h4 class="filter-title">Categorias</h4>
        <div class="filter-options">
          <label class="filter-option">
            <input type="checkbox" checked data-category="startup">
            <span class="checkmark"></span>
            Startups
          </label>
          <label class="filter-option">
            <input type="checkbox" checked data-category="empresa">
            <span class="checkmark"></span>
            Empresas
          </label>
          <label class="filter-option">
            <input type="checkbox" checked data-category="universidade">
            <span class="checkmark"></span>
            Universidades
          </label>
          <label class="filter-option">
            <input type="checkbox" checked data-category="governo">
            <span class="checkmark"></span>
            Governo
          </label>
          <label class="filter-option">
            <input type="checkbox" checked data-category="evento">
            <span class="checkmark"></span>
            Eventos
          </label>
        </div>
      </div>

      <div class="filter-group">
        <h4 class="filter-title">Áreas de Atuação</h4>
        <div class="filter-options">
          <label class="filter-option">
            <input type="checkbox" checked data-area="tecnologia">
            <span class="checkmark"></span>
            Tecnologia
          </label>
          <label class="filter-option">
            <input type="checkbox" checked data-area="educacao">
            <span class="checkmark"></span>
            Educação
          </label>
          <label class="filter-option">
            <input type="checkbox" checked data-area="industria">
            <span class="checkmark"></span>
            Indústria
          </label>
          <label class="filter-option">
            <input type="checkbox" checked data-area="servicos">
            <span class="checkmark"></span>
            Serviços
          </label>
        </div>
      </div>

      <button class="add-point-button" id="addPointBtn" (click)="openAddPointModal()">
        <i class="fas fa-plus"></i> Adicionar Ponto
      </button>
    </aside>

    <!-- Map Visualization -->
    <div class="map-visualization">
      <div id="map"></div>
      <div class="map-legend">
        <div class="legend-item"><span class="legend-color startup"></span> Startups</div>
        <div class="legend-item"><span class="legend-color company"></span> Empresas</div>
        <div class="legend-item"><span class="legend-color university"></span> Universidades</div>
        <div class="legend-item"><span class="legend-color government"></span> Governo</div>
        <div class="legend-item"><span class="legend-color event"></span> Eventos</div>
      </div>
    </div>
  </div>

  <!-- Add Point Modal -->
  @if (showModal) {
    <div class="modal" id="addPointModal" style="display: block;">
      <div class="modal-content">
        <span class="close-modal" (click)="hideAddPointModalPublic()">&times;</span>
        <h3>Adicionar Novo Ponto</h3>
        
        <form id="addPointForm" (ngSubmit)="submitNewPoint()">
          <div class="form-group">
            <label for="pointName">Nome do Local/Organização</label>
            <input type="text" id="pointName" name="pointName" [(ngModel)]="newPoint.name" required>
          </div>

          <div class="form-group">
            <label for="pointCategory">Categoria</label>
            <select id="pointCategory" name="pointCategory" [(ngModel)]="newPoint.category" required>
              <option value="">Selecione...</option>
              <option value="startup">Startup</option>
              <option value="empresa">Empresa</option>
              <option value="universidade">Universidade</option>
              <option value="governo">Órgão Governamental</option>
              <option value="evento">Evento</option>
            </select>
          </div>

          <div class="form-group">
            <label for="pointAddress">Endereço</label>
            <input type="text" id="pointAddress" name="pointAddress" [(ngModel)]="newPoint.address" required>
            <button type="button" id="searchAddress" (click)="searchAddress()">Buscar no Mapa</button>
          </div>

          <div class="form-group">
            <label for="pointDescription">Descrição</label>
            <textarea id="pointDescription" name="pointDescription" [(ngModel)]="newPoint.description" rows="3"></textarea>
          </div>

          <div class="form-group">
            <label for="pointWebsite">Website</label>
            <input type="url" id="pointWebsite" name="pointWebsite" [(ngModel)]="newPoint.website">
          </div>

          <div class="form-actions">
            <button type="button" class="cancel-button" (click)="hideAddPointModalPublic()">Cancelar</button>
            <button type="button" class="submit-button" (click)="submitNewPoint()" [disabled]="isSubmitting">
              {{ isSubmitting ? 'Enviando...' : 'Adicionar Ponto' }}
            </button>
          </div>
        </form>
      </div>
    </div>
  }

  <!-- Notification Popup -->
  @if (showPopup) {
    <div class="popup-notification" [ngClass]="popupType">
      {{ popupMessage }}
    </div>
  }
</div>
