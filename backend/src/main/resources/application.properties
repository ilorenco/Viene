spring.application.name=backend

# Perfil ativo: "dev" (H2 em memoria, padrao local) ou "prod" (SQL Server no Azure).
# Em producao, defina SPRING_PROFILES_ACTIVE=prod nas configuracoes do App Service.
# Cada perfil tem seu proprio arquivo: application-dev.properties / application-prod.properties.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Segredo de assinatura do JWT (HS256). Precisa ser um Base64 valido que decodifique
# para >= 32 bytes (ver JwtService). NENHUM segredo fica aqui:
#  - producao: vem da variavel de ambiente VIENE_JWT_SECRET (obrigatoria; sem ela o
#    app falha no boot de proposito -- melhor que usar um segredo conhecido).
#  - dev local: o valor (so para teste) esta em application-dev.properties.
viene.jwt.secret=${VIENE_JWT_SECRET}
viene.jwt.expiration-ms=86400000

# Conta admin "semente" criada no boot caso ainda nao exista um admin com este e-mail.
# A senha vem de VIENE_ADMIN_PASSWORD: em producao, da variavel de ambiente; em dev,
# de application-dev.properties. Default vazio = se nao houver senha, o admin NAO e'
# criado (nunca com senha em branco) -- nenhuma senha fica versionada aqui.
viene.seed.admin.name=Administrador
viene.seed.admin.email=admin@viene.com
viene.seed.admin.password=${VIENE_ADMIN_PASSWORD:}

# Usuarios extras semeados no boot (admins reais, atores, etc.), criados so se ainda
# nao existirem. As SENHAS vem de variaveis de ambiente -- NUNCA escreva a senha aqui
# (este arquivo esta no git). Se a variavel de senha estiver vazia, o usuario e'
# IGNORADO (nunca e' criado com senha em branco).
# Descomente e ajuste com a lista real (peca os e-mails/papeis ao Thiago):
# viene.seed.users[0].name=Nome Sobrenome
# viene.seed.users[0].email=pessoa@viene.com
# viene.seed.users[0].role=ADMIN
# viene.seed.users[0].password=${VIENE_SEED_USER_0_PASSWORD:}
# viene.seed.users[1].name=Outra Pessoa
# viene.seed.users[1].email=outra@viene.com
# viene.seed.users[1].role=ADMIN
# viene.seed.users[1].password=${VIENE_SEED_USER_1_PASSWORD:}

# Origens permitidas no CORS (lista separada por virgula). Em dev e' localhost; em
# producao, defina VIENE_CORS_ALLOWED_ORIGINS com o dominio do frontend no Vercel.
# Ex.: https://viene.vercel.app,https://*.vercel.app  (o curinga cobre os previews).
viene.cors.allowed-origins=${VIENE_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Upload de imagens (foto de perfil, Ator, Evento).
viene.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
