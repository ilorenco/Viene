spring.application.name=backend

# Banco H2 em memória (dev). DB_CLOSE_DELAY=-1 mantém os dados enquanto a JVM estiver viva.
spring.datasource.url=jdbc:h2:mem:viene;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Segredo de assinatura do JWT (HS256). Em produção, sobrescrever via variável de
# ambiente (VIENE_JWT_SECRET) em vez de manter um segredo fixo versionado.
viene.jwt.secret=${VIENE_JWT_SECRET:yEnAe6r4qksqsm7287W4UY1xNbRbRtnocA8HgBJJzGDQOItE0E2ALb17U8TkrtS9}
viene.jwt.expiration-ms=86400000

# Conta admin criada automaticamente no boot, caso ainda não exista nenhum admin.
viene.seed.admin.name=Administrador
viene.seed.admin.email=admin@viene.com
viene.seed.admin.password=${VIENE_ADMIN_PASSWORD:Admin123!}
