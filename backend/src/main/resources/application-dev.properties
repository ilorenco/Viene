# Perfil DEV (padrao local): banco H2 em memoria, que ZERA a cada restart.
# Nao precisa de nenhum segredo nem do Azure -- roda com "mvnw spring-boot:run".
spring.datasource.url=jdbc:h2:mem:viene;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=update

# Console do H2 (so em dev) em http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Valores SO PARA DEV LOCAL (perfil dev, banco H2 efemero). NAO valem em producao
# (la tudo vem das variaveis de ambiente do App Service). Nao reutilize em nada real. ---
# Segredo JWT de dev (Base64, decodifica para 48 bytes -- valido p/ HS256).
viene.jwt.secret=${VIENE_JWT_SECRET:rM39TRpIdjVdOsU1Wy5OuYOAeUIzhxuyStrewqyeyV6g8oJ/IWekYHgt3XpoZVqf}
# Senha do admin "semente" no dev (admin@viene.com / Admin123!).
viene.seed.admin.password=${VIENE_ADMIN_PASSWORD:Admin123!}
