# Perfil DEV (padrao local): banco H2 em memoria, que ZERA a cada restart.
# Nao precisa de nenhum segredo nem do Azure -- roda com "mvnw spring-boot:run".
spring.datasource.url=jdbc:h2:mem:viene;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=update

# Console do H2 (so em dev) em http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
