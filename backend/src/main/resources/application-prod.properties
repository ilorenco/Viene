# Perfil PROD: Azure SQL Server.
# Os valores vem SO de variaveis de ambiente -- NENHUM segredo e' escrito aqui
# (este arquivo esta no git). Se a variavel faltar, a aplicacao falha no boot de
# proposito (melhor um erro claro do que cair silenciosamente num banco errado).
spring.datasource.url=${AZURE_SQL_URL}
spring.datasource.username=${AZURE_SQL_USER}
spring.datasource.password=${AZURE_SQL_PASSWORD}

# Hibernate cria/atualiza as tabelas conforme as entidades. Para um projeto em
# evolucao isso e' pratico; quando o schema estabilizar, vale trocar por migracoes
# (Flyway/Liquibase) e usar "validate" aqui.
spring.jpa.hibernate.ddl-auto=update

# Para testar o perfil "prod" LOCALMENTE sem expor segredos: copie o arquivo
# application-secrets.properties.example para application-secrets.properties (ja no
# .gitignore) e preencha la. Em producao esse arquivo nao existe e os valores vem
# das variaveis de ambiente do Azure. "optional:" evita erro quando o arquivo falta.
spring.config.import=optional:classpath:application-secrets.properties
