name: Deploy Backend (Azure App Service)

# Publica o back-end Spring Boot no Azure App Service "viene-api".
# Dispara quando algo em backend/ vai parar na main (apos o merge do PR),
# ou manualmente pela aba "Actions" (workflow_dispatch).
#
# PRE-REQUISITO: o segredo AZUREAPPSERVICE_PUBLISHPROFILE precisa estar
# configurado em Settings > Secrets and variables > Actions. Como obter:
# ver .github/DEPLOY-AZURE.md.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: viene-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build com Maven (sem testes)
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Deploy para o Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: backend/target/*.jar
